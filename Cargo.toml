[package]
name = "psref_scraper"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.2"
polars = { version = "0.52", features = ["parquet", "lazy", "timezones", "diagonal_concat"] }
