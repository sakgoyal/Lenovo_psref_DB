[package]
name = "psref_scraper"
version = "0.2.0"
description = "A Rust-based scraper for the Lenovo PSREF website to extract and process product specifications."
repository = "https://github.com/sakgoyal/Lenovo_psref_DB"


edition = "2024"
license = "GPL-3.0-only"
authors = ["Saksham Goyal <sakgoy2001@gmail.com>"]
categories = [
	"command-line-utilities",
	"database",
	"data-processing",
	"text-processing",
]


[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {version = "1.0.151", features = ["preserve_order"]}
regex = "1.13.1"
polars = { version = "0.54.4", features = ["parquet", "lazy", "diagonal_concat", "partition_by", "strings"] }

[[bin]]
name = "psref_scraper"
path = "main.rs"
