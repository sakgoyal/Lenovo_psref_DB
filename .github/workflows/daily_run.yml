name: Daily Script Run

on:
  schedule:
    - cron: "23 9 * * *" # Runs daily at 9:23 AM UTC
  push:
    branches:
      - main # Also runs on every push to the main branch

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        # pip-install: --upgrade pandas pyarrow requests
        cache: 'pip'

    - name: Install Deps
      run: python3 -m pip install .

    - name: Run Script
      run: python3 main.py

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "Update Daily $(date -u +'%B %d, %Y')"
        title: "Update Daily $(date -u +'%B %d, %Y')"
        body: |
          Automated daily update.
          This PR was generated by the 'Daily Script Run' workflow.
        branch: daily-updates-$(date -u +'%Y-%m-%d')
        delete-branch: true
        author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
