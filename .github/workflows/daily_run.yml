name: Daily Script Run

on:
  schedule:
    - cron: "23 9 * * *" # Runs daily at 9:23 AM UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v5
    - run: cargo run --release --verbose


    - name: Set output variables
      id: vars
      run: |
          pr_text="Update Daily $(date -u +'%B %d, %Y')"
          echo "pr_text=$pr_text" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: ${{ steps.vars.outputs.pr_text }}
        title: ${{ steps.vars.outputs.pr_text }}
        body: |
          Automated daily update.
          This PR was generated by the 'Daily Script Run' workflow.
        branch: daily-updates-${{ github.run_id }}
        delete-branch: true
