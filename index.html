	];

	let filteredArray = [];

	function parseTotalGB(str) {
		const multMatch = str.match(/^(\d+)x\s*(\d+)GB/i);
		if (multMatch) {
			return parseInt(multMatch[1]) * parseInt(multMatch[2]);
		}

		const parenMatch = str.match(/^(\d+)GB\s*\(/i);
		if (parenMatch) {
			return parseInt(parenMatch[1]);
		}

		const gbMatches = str.match(/(\d+)\s*GB/gi) ?? [];
		return gbMatches.reduce((sum, match) => sum + parseInt(match), 0);
	}

	const configs = rawConfigs.map(config => ({
		config: config,
		totalGB: parseTotalGB(config)
	}));

	const uniqueGBs = [...new Set(configs.map(c => c.totalGB))]
		.filter(gb => gb > 0)
		.sort((a, b) => a - b);

	const slider = document.getElementById('gb-slider');

	function updateConfigs() {
		const selectedGB = uniqueGBs[slider.value];

		filteredArray = configs
			.filter(c => c.totalGB >= selectedGB)
			.map(c => c.config);

		console.log(filteredArray);
	}

	function init() {
		slider.max = uniqueGBs.length - 1;
		slider.addEventListener('input', updateConfigs);
		updateConfigs();
	}

	document.addEventListener('DOMContentLoaded', init);
